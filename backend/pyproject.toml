[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pfos-backend"
version = "0.1.0"
description = "Personal Finance OS — FastAPI backend (modular monolith)"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5,<3",
    "pyjwt[crypto]>=2.8,<3",
    "email-validator>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008: `Depends(...)` in function defaults is the idiomatic FastAPI pattern.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic's env.py must inject the backend onto sys.path before importing app
# models, which necessarily places first-party imports after code.
"alembic/env.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
